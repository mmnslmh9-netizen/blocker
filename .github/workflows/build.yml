name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Build App
        run: |
          python3 - << 'EOF'
          import base64
          u = base64.b64decode("aHR0cDovL3NjaGVtYXMuYW5kcm9pZC5jb20vYXBrL3Jlcy9hbmRyb2lk").decode()
          open("app/src/main/AndroidManifest.xml","w").write(f'<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="{u}"><queries><intent><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent></queries><application android:label="חוסם תכנים" android:supportsRtl="true" android:theme="@android:style/Theme.Material.NoActionBar"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity><activity android:name=".BlockActivity" android:exported="false" android:excludeFromRecents="true" android:launchMode="singleTask"/><service android:name=".BlockerService" android:exported="true" android:label="חוסם תכנים" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"><intent-filter><action android:name="android.accessibilityservice.AccessibilityService"/></intent-filter><meta-data android:name="android.accessibilityservice" android:resource="@xml/accessibility_service_config"/></service></application></manifest>')
          open("app/src/main/res/xml/accessibility_service_config.xml","w").write(f'<?xml version="1.0" encoding="utf-8"?><accessibility-service xmlns:android="{u}" android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged" android:accessibilityFeedbackType="feedbackGeneric" android:accessibilityFlags="flagDefault|flagRetrieveInteractiveWindows|flagReportViewIds" android:canRetrieveWindowContent="true" android:notificationTimeout="100"/>')
          open("app/src/main/java/com/chosem/blocker/BlockerService.kt","w").write('package com.chosem.blocker\nimport android.accessibilityservice.AccessibilityService\nimport android.content.*\nimport android.view.accessibility.AccessibilityEvent\nclass BlockerService:AccessibilityService(){companion object{var uPkg:String?=null;var uTime=0L}\nprivate var last=0L\noverride fun onAccessibilityEvent(e:AccessibilityEvent?){val p=e?.packageName?.toString()?:return\nif(p=="com.chosem.blocker"||p==packageName||p=="com.android.systemui"||p.contains("launcher"))return\nval pr=getSharedPreferences("blocker_prefs",0)\nif(!pr.getBoolean("is_active",false))return\nif(!(pr.getStringSet("blocked_apps",emptySet())?:emptySet()).contains(p))return\nif(p==uPkg&&System.currentTimeMillis()-uTime<60000L)return\nif(System.currentTimeMillis()-last>700L){last=System.currentTimeMillis();performGlobalAction(GLOBAL_ACTION_HOME);try{startActivity(Intent(this,BlockActivity::class.java).apply{addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP);putExtra("pkg",p)})}catch(_:Exception){}}}\noverride fun onInterrupt(){}}')
          open("app/src/main/java/com/chosem/blocker/BlockActivity.kt","w").write('package com.chosem.blocker\nimport android.app.Activity\nimport android.graphics.*\nimport android.graphics.drawable.GradientDrawable\nimport android.os.Bundle\nimport android.text.InputType\nimport android.view.Gravity\nimport android.widget.*\nclass BlockActivity:Activity(){override fun onCreate(b:Bundle?){super.onCreate(b)\nval pkg=intent.getStringExtra("pkg")?:""\nval pin=getSharedPreferences("blocker_prefs",0).getString("user_pin","1234")?:"1234"\nval r=LinearLayout(this).apply{orientation=LinearLayout.VERTICAL;setBackgroundColor(Color.parseColor("#060B19"));gravity=Gravity.CENTER;setPadding(60,60,60,60)}\nval c=LinearLayout(this).apply{orientation=LinearLayout.VERTICAL;gravity=Gravity.CENTER;setPadding(50,60,50,60);background=GradientDrawable().apply{setColor(Color.parseColor("#0F1B38"));cornerRadius=40f;setStroke(4,Color.parseColor("#00D2FF"))}}\nc.addView(TextView(this).apply{text="🛡️ אפליקציה נעולה";textSize=25f;setTextColor(Color.WHITE);gravity=Gravity.CENTER})\nc.addView(TextView(this).apply{text="הזן קוד PIN לפתיחה:";textSize=15f;setTextColor(Color.parseColor("#90E0EF"));gravity=Gravity.CENTER;setPadding(0,12,0,28)})\nval inp=EditText(this).apply{inputType=InputType.TYPE_CLASS_NUMBER or InputType.TYPE_NUMBER_VARIATION_PASSWORD;hint="••••";setHintTextColor(Color.GRAY);setTextColor(Color.WHITE);textSize=24f;gravity=Gravity.CENTER}\nc.addView(inp)\nc.addView(Button(this).apply{text="פתיחת אפליקציה";setTextColor(Color.WHITE);background=GradientDrawable().apply{setColor(Color.parseColor("#00B4D8"));cornerRadius=24f};setOnClickListener{if(inp.text.toString().trim()==pin){BlockerService.uPkg=pkg;BlockerService.uTime=System.currentTimeMillis();packageManager.getLaunchIntentForPackage(pkg)?.let{startActivity(it)};finish()}else{Toast.makeText(this@BlockActivity,"קוד שגוי",Toast.LENGTH_SHORT).show()}}})\nr.addView(c);setContentView(r)}\noverride fun onBackPressed(){moveTaskToBack(true);finish()}}')
          open("app/src/main/java/com/chosem/blocker/MainActivity.kt","w").write('package com.chosem.blocker\nimport android.app.*\nimport android.content.*\nimport android.content.pm.PackageManager\nimport android.graphics.Color\nimport android.graphics.drawable.GradientDrawable\nimport android.os.Bundle\nimport android.provider.Settings\nimport android.text.InputType\nimport android.view.Gravity\nimport android.widget.*\nclass MainActivity:Activity(){private lateinit var pr:SharedPreferences\nprivate val sel=mutableSetOf<String>()\noverride fun onCreate(b:Bundle?){super.onCreate(b);pr=getSharedPreferences("blocker_prefs",0);sel.addAll((pr.getStringSet("blocked_apps",emptySet())?:emptySet()).filter{it!="com.chosem.blocker"&&it!=packageName});pr.edit().putStringSet("blocked_apps",sel.toSet()).apply();ask()}\nprivate fun ask(){val sp=pr.getString("user_pin",null);val inp=EditText(this).apply{inputType=InputType.TYPE_CLASS_NUMBER or InputType.TYPE_NUMBER_VARIATION_PASSWORD;hint=if(sp==null)"בחר קוד חדש (4 ספרות)" else "הזן קוד PIN";gravity=Gravity.CENTER;textSize=22f};AlertDialog.Builder(this).setTitle(if(sp==null)"🛡️ הגדרת קוד נעילה" else "🛡️ חוסם תכנים").setView(inp).setCancelable(false).setPositiveButton("כניסה"){_,_->val c=inp.text.toString().trim();if(sp==null&&c.length>=4){pr.edit().putString("user_pin",c).apply();ui()}else if(c==sp){ui()}else{Toast.makeText(this,"קוד שגוי",Toast.LENGTH_SHORT).show();ask()}}.setNegativeButton("יציאה"){_,_->finish()}.show()}\nprivate fun bg(s:String="#1D3557")=GradientDrawable().apply{setColor(Color.parseColor("#0F1B38"));cornerRadius=32f;setStroke(3,Color.parseColor(s))}\nprivate fun ui(){val r=LinearLayout(this).apply{orientation=LinearLayout.VERTICAL;setBackgroundColor(Color.parseColor("#060B19"));setPadding(36,40,36,24)}\nval h=LinearLayout(this).apply{orientation=LinearLayout.VERTICAL;gravity=Gravity.CENTER;setPadding(30,36,30,36);background=bg("#00D2FF")}\nh.addView(TextView(this).apply{text="🛡️ חוסם תכנים";textSize=28f;setTextColor(Color.WHITE);gravity=Gravity.CENTER})\nh.addView(Switch(this).apply{text="חסימה פעילה";textSize=20f;setTextColor(Color.parseColor("#4ADE80"));isChecked=pr.getBoolean("is_active",false);setPadding(0,20,0,0);setOnCheckedChangeListener{_,on->pr.edit().putBoolean("is_active",on).apply()}})\nr.addView(h)\nr.addView(Button(this).apply{text="⚙️ הפעלת שירות חסימה בהגדרות";setTextColor(Color.WHITE);background=GradientDrawable().apply{setColor(Color.parseColor("#0077B6"));cornerRadius=24f};setOnClickListener{startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))}},LinearLayout.LayoutParams(-1,-2).apply{topMargin=20})\nval cr=LinearLayout(this).apply{orientation=LinearLayout.HORIZONTAL;setPadding(0,20,0,16)}\nval pm=packageManager\nval apps=pm.getInstalledApplications(PackageManager.GET_META_DATA).filter{pm.getLaunchIntentForPackage(it.packageName)!=null&&it.packageName!="com.chosem.blocker"&&it.packageName!=packageName}.sortedBy{pm.getApplicationLabel(it).toString().lowercase()}\nfun cb(t:String,col:String,f:()->Unit)=Button(this).apply{text=t;textSize=12f;setTextColor(Color.WHITE);background=GradientDrawable().apply{setColor(Color.parseColor(col));cornerRadius=20f};setOnClickListener{f();ui()}}\ncr.addView(cb("📱 רשתות","#1E293B"){apps.filter{a->listOf("tiktok","musically","instagram","facebook","telegram","snapchat").any{a.packageName.contains(it,true)}}.forEach{sel.add(it.packageName)};pr.edit().putStringSet("blocked_apps",sel.toSet()).apply()},LinearLayout.LayoutParams(0,-2,1f).apply{marginEnd=8})\ncr.addView(cb("🌐 דפדפנים","#1E293B"){apps.filter{a->listOf("chrome","browser","opera","firefox","brave").any{a.packageName.contains(it,true)}}.forEach{sel.add(it.packageName)};pr.edit().putStringSet("blocked_apps",sel.toSet()).apply()},LinearLayout.LayoutParams(0,-2,1f).apply{marginEnd=8})\ncr.addView(cb("🧹 נקה הכל","#7F1D1D"){sel.clear();pr.edit().putStringSet("blocked_apps",emptySet()).apply()},LinearLayout.LayoutParams(0,-2,1f))\nr.addView(cr)\nval sc=ScrollView(this);val l=LinearLayout(this).apply{orientation=LinearLayout.VERTICAL}\nfor(a in apps){val row=LinearLayout(this).apply{setPadding(24,18,24,18);background=bg()};row.addView(CheckBox(this).apply{text="  "+pm.getApplicationLabel(a);setTextColor(Color.WHITE);textSize=16f;isChecked=sel.contains(a.packageName);setOnCheckedChangeListener{_,c->if(c)sel.add(a.packageName)else sel.remove(a.packageName);pr.edit().putStringSet("blocked_apps",sel.toSet()).apply()}});l.addView(row,LinearLayout.LayoutParams(-1,-2).apply{bottomMargin=12})}\nsc.addView(l);r.addView(sc);setContentView(r)}}')
          EOF
          gradle assembleDebug
      - uses: actions/upload-artifact@v4
