name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Generate Clean XMLs and Build
        run: |
          python3 -c '
          import base64
          u = base64.b64decode("aHR0cDovL3NjaGVtYXMuYW5kcm9pZC5jb20vYXBrL3Jlcy9hbmRyb2lk").decode()
          manifest = f"""<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="{u}">
              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
              </queries>
              <application
                  android:label="חוסם תכנים"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity
                      android:name=".BlockActivity"
                      android:exported="false"
                      :excludeFromRecents="true"
                      android:launchMode="singleTask" />
                  <service
                      android:name=".BlockerService"
                      android:exported="true"
                      android:label="חוסם תכנים"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>
          </manifest>"""
          open("app/src/main/AndroidManifest.xml", "w").write(manifest)

          acc = f"""<?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="{u}"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagRetrieveInteractiveWindows|flagReportViewIds"
              android:canRetrieveWindowContent="true"
              android:notificationTimeout="100" />"""
          open("app/src/main/res/xml/accessibility_service_config.xml", "w").write(acc)
          '
          gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: chosem-apk
          path: app/build/outputs/apk/debug/*.apk
